# CI per 07-development/deployment-devops.md — PR: lint → typecheck → unit/golden → build.
# API integration (Testcontainers), e2e, and openapi-drift stages are added when those
# surfaces exist (Phase 0 W5 onward).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format:check

  # Preview deploys (Vercel: admin, pos-web, Storybook; Fly.io: api) are wired but
  # disabled until hosting credentials are provided — see 03-architecture/tech-stack.md
  # CI/CD row. Enable by adding VERCEL_TOKEN / FLY_API_TOKEN secrets and removing the
  # `if: false` guard.
  preview-deploy:
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - run: echo "pending hosting credentials"
